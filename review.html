<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fan Poll - Outrage Esport</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            line-height: 1.6;
        }

        /* Top-Left 3-Line Menu Bar */
        .menu-container {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 50;
        }

        .menu-toggle {
            width: 44px;
            height: 44px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .menu-toggle:hover {
            background: rgba(255, 255, 255, 0.20);
        }

        .menu-toggle span {
            display: block;
            width: 22px;
            height: 2px;
            background: #ffffff;
            border-radius: 2px;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .menu-toggle.open span:nth-child(1) {
            transform: translateY(7px) rotate(45deg);
        }

        .menu-toggle.open span:nth-child(2) {
            opacity: 0;
        }

        .menu-toggle.open span:nth-child(3) {
            transform: translateY(-7px) rotate(-45deg);
        }

        .nav-menu {
            position: absolute;
            top: 54px;
            left: 0;
            min-width: 180px;
            background: rgba(20, 20, 20, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.20);
            border-radius: 14px;
            padding: 8px;
            display: none;
            flex-direction: column;
            gap: 4px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        }

        .nav-menu.active {
            display: flex;
        }

        .nav-menu a {
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            padding: 10px 14px;
            border-radius: 8px;
            transition: background 0.2s ease, color 0.2s ease;
        }

        .nav-menu a:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
        }

        .nav-menu a.active {
            background: rgba(255, 223, 126, 0.18);
            color: #ffdf7e;
        }

        .Review-page {
            position: relative;
            width: 100%;
            min-height: 100vh;
            background-image: url("background.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 75px 20px 40px;
        }

        @media (max-width: 768px) {
            .Review-page {
                background-image: url("background-mobile.png");
            }
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.72);
            z-index: 1;
        }

        .content-container {
            position: relative;
            z-index: 2;
            max-width: 580px;
            width: 100%;
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(24px) saturate(150%);
            -webkit-backdrop-filter: blur(24px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.20);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.45);
            text-align: center;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.30);
        }

        .tagline {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 1px;
            color: #ffdf7e;
            margin-bottom: 24px;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
        }

        .Review-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .form-group:last-of-type {
            border-bottom: none;
            padding-bottom: 0;
        }

        .question-label {
            font-size: 14px;
            color: #ffffff;
            font-weight: 600;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 11px 14px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: #ffdf7e;
        }

        textarea {
            resize: vertical;
            min-height: 85px;
        }

        .mcq-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .mcq-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            cursor: pointer;
            font-size: 13.5px;
            color: rgba(255, 255, 255, 0.92);
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .mcq-option:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 223, 126, 0.5);
        }

        .mcq-option input[type="radio"] {
            accent-color: #ffdf7e;
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            background: white;
            color: black;
            border: none;
            font-weight: 700;
            font-size: 14px;
            border-radius: 999px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.30);
            transition: transform 0.2s ease, background 0.2s ease;
            margin-top: 8px;
        }

        .submit-btn:hover {
            transform: scale(1.02);
            background: #ffdf7e;
        }

        .back-link {
            display: inline-block;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 13px;
            transition: color 0.2s ease;
        }

        .back-link:hover {
            color: white;
            text-decoration: underline;
        }

        /* Success Popup Modal Overlay */
        .popup-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .popup-overlay.active {
            display: flex;
            opacity: 1;
        }

        .popup-box {
            background: rgba(30, 30, 30, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 16px;
            padding: 30px;
            max-width: 340px;
            width: 90%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            transform: scale(0.9);
            transition: transform 0.3s ease;
        }

        .popup-overlay.active .popup-box {
            transform: scale(1);
        }

        .popup-box h3 {
            font-size: 20px;
            margin-bottom: 10px;
            color: #ffdf7e;
        }

        .popup-box p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 20px;
        }

        .popup-btn {
            padding: 10px 24px;
            background: white;
            color: black;
            border: none;
            border-radius: 999px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .popup-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <!-- TOP LEFT 3-LINE MENU BAR -->
    <div class="menu-container">
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle Menu">

    <main class="Review-page">
        <div class="overlay"></div>

        <div class="content-container">
            <h1>🚨 Is The Legacy Destroyed? 💔</h1>
            <div class="tagline">⚡ Outrage Esport Fan Poll ⚡</div>

            <form class="Review-form" id="ReviewForm" action="https://formsubmit.co/ajax/aryan223ptl@gmail.com" method="POST">
                <input type="hidden" name="_subject" value="New Fan Poll Vote - Team Outrage & Omega">
                <input type="hidden" name="_captcha" value="false">

                <!-- Fan Name / IGN -->
                <div class="form-group">
                    <label class="question-label" for="fan_name">Your Name / In-Game Name (IGN)</label>
                    <input type="text" id="fan_name" name="Fan_Name" required placeholder="Enter your name or IGN">
                </div>

                <!-- MCQ 1: Team Outrage & Apex Gaming Rumours -->
                <div class="form-group">
                    <label class="question-label">1. Whispers say Team Omega's current lineup might leave Team Outrage for Jonathan's Apex Gaming. What's your take?</label>
                    <div class="mcq-options">
                        <label class="mcq-option">
                            <input type="radio" name="Q1_Team_Outrage_Apex_Rumour" value="Hyped! Omega & Co. in Apex Gaming will dominate" required>
                            <span>Hyped! Omega & Co. in Apex Gaming will dominate 🔥</span>
                        </label>
                        <label class="mcq-option">

                        </label>
                        <label class="mcq-option">
                            <input type="radio" name="Q1_Team_Outrage_Apex_Rumour" value="Just rumours, they are staying in Outrage">
                            <span>Just rumours—they aren't going anywhere 👀</span>
                        </label>
                        <label class="mcq-option">
                            <input type="radio" name="Q1_Team_Outrage_Apex_Rumour" value="Will support the squad no matter which banner they play under">
                            <span>Will support the boys no matter which banner they play under 🙌</span>

                    </div>

                    <label class="question-label">2. Knight put "Open for Opportunity" on his Instagram story and deleted it within 5–8 minutes. Was it a prank or a real sign?</label>

                        <label class="mcq-option">
                            <input type="radio" name="Q2_Knight_Deleted_Story" value="100% a prank / troll by Knight on the fans" required>
                            <span>100% a prank / troll by Knight to scare the fans 😂</span>
                        </label>
                        <label class="mcq-option">
                            <input type="radio" name="Q2_Knight_Deleted_Story" value="Posted early by mistake before official roster news">
                            <span>Posted early by mistake before an official roster announcement 👀</span>

                            <span>Backup / rotation option in case Knight or another player leaves 🔄</span>
                        </label>
                        <label class="mcq-option">
                            <input type="radio" name="Q3_JDGamingYT_5th_Man" value="Map-specific tactical 5th man to boost CEGC & 2027 dominance">
                            <span>Map-specific tactical 5th man to boost their CEGC & 2027 run 🧠</span>
                        </label>
                        <label class="mcq-option">
                            <input type="radio" name="Q3_JDGamingYT_5th_Man" value="Proves the core 4 (Omega, Slug, NinjaBoi, Knight) are staying put">
                            <span>Proves they are building around the core 4, not breaking up 💪</span>
                        </label>
                    </div>
                </div>

                <!-- MCQ 4: Omega's Owner + IGL Rumours -->
                <div class="form-group">
                    <label class="question-label">4. Rumours say Omega holds an ownership stake in Team Outrage. If true, how likely is it that he actually leaves for another org?</label>
                    <div class="mcq-options">
                        <label class="mcq-option">
                            <input type="radio" name="Q4_Omega_Owner_Rumour" value="Zero chance—an owner won't abandon his own banner" required>

                        <label class="mcq-option">
                            <input type="radio" name="Q4_Omega_Owner_Rumour" value="BGMI business is unpredictable—anything can happen">
                            <span>BGMI esports business is unpredictable—anything can happen 🎲</span>

                <!-- MCQ 5: NinjaBoi & Slug Poaching Whispers -->
                <div class="form-group">
                    <label class="question-label">5. Tier-1 orgs (like GodLike, SouL, & Apex) are always rumoured to be eyeing NinjaBoi's entry fragging and Slug's clutch survival. Do you think either would ever split from Omega?</label>

                            <input type="radio" name="Q5_NinjaBoi_Slug_Poaching" value="After topping CEGC Group Stage 1 at #1, why leave a winning team?">

                        </label>

                <!-- MCQ 6: Player Spotlight - MVP / Backbone of the Roster -->
                <div class="form-group">
                    <label class="question-label">6. Between Ninjaboi's insane firepower, Knight's clutch plays, Slug's filter role, and Omega's IGLing—who is the true backbone of this roster?</label>
                    <div class="mcq-options">
                        <label class="mcq-option">
                            <input type="radio" name="Q6_Roster_Backbone" value="Omega (IGL & Mastermind)" required>
                            <span>Omega — the IGL & mastermind behind every zone call 🧠</span>
                        </label>
                        <label class="mcq-option">
                            <input type="radio" name="Q6_Roster_Backbone" value="Ninjaboi & Knight (The Unstoppable Assault Duo)">

                            <input type="radio" name="Q8_Apex_Synergy" value="Won't happen, they are staying in Team Outrage">

                    <label class="question-label">9. If this really is the end of an era for the current lineup, what should Team Outrage do next?</label>
                    <div class="mcq-options">
                        <label class="mcq-option">
                            <input type="radio" name="Q9_Outrage_Future" value="Sign a proven Tier-1 lineup right away" required>
                            <span>Sign a proven Tier-1 lineup right away</span>
                        </label>
                        <label class="mcq-option">
                            <input type="radio" name="Q9_Outrage_Future" value="Scout fresh underdog grinders and build a new legacy">

            <a href="index.html" class="back-link">← Back to Home</a>

    <!-- Success Popup Modal -->
    <div class="popup-overlay" id="popupOverlay">
        <div class="popup-box">
            <h3>Vote Recorded! ⚡</h3>
            <p>Thanks for sharing your take on Team Outrage, Knight's story & the roster rumours!</p>
            <button class="popup-btn" id="popupCloseBtn">OK</button>
        </div>
    </div>

    <script>
        // Menu Bar Toggle Logic
        const menuToggle = document.getElementById('menuToggle');
        const navMenu = document.getElementById('navMenu');

        menuToggle.addEventListener('click', function(e) {
            e.stopPropagation();
            menuToggle.classList.toggle('open');
            navMenu.classList.toggle('active');
        });

        document.addEventListener('click', function(e) {
            if (!navMenu.contains(e.target) && !menuToggle.contains(e.target)) {
                menuToggle.classList.remove('open');
                navMenu.classList.remove('active');
            }
        });

        // Form Submission Logic
        const ReviewForm = document.getElementById('ReviewForm');
        const submitBtn = document.getElementById('submitBtn');
        const popupOverlay = document.getElementById('popupOverlay');
        const popupCloseBtn = document.getElementById('popupCloseBtn');

        ReviewForm.addEventListener('submit', function(e) {
            e.preventDefault();

            submitBtn.textContent = "Submitting...";
            submitBtn.disabled = true;

            const formData = new FormData(ReviewForm);

            fetch(ReviewForm.action, {
                method: 'POST',
                body: formData,
                headers: {
                    'Accept': 'application/json'
                }
            })
            .then(response => {
                if (response.ok) {
                    popupOverlay.classList.add('active');
                    ReviewForm.reset();
                } else {
                    alert("Oops! Something went wrong, please try again.");
                }
            })
            .catch(error => {
                alert("Network error. Please check your connection.");
            })
            .finally(() => {
                submitBtn.textContent = "Submit My Vote";
                submitBtn.disabled = false;
            });
        });

        popupCloseBtn.addEventListener('click', function() {
            popupOverlay.classList.remove('active');
        });

        popupOverlay.addEventListener('click', function(e) {
            if (e.target === popupOverlay) {
                popupOverlay.classList.remove('active');
            }
        });
    </script>
