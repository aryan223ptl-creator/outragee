<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Outrage Esport</title>

    <style>

        /* =========================
           BASIC RESET
        ========================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            /* Changed from hidden to allow proper mobile vertical scrolling */
            overflow-x: hidden; 
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #08080c;
        }


       /* =========================
           HOMEPAGE BACKGROUND
        ========================== */

        .homepage {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;

            background-image: url("background.png");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* =========================
           MOBILE RESPONSIVE BACKGROUND
        ========================== */

        @media (max-width: 768px) {
            .homepage {
                background-image: url("background-mobile.png");
                background-size: cover; 
                background-position: center;
            }
        }


        /* =========================
           DARK OVERLAY
        ========================== */

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.20);
            z-index: 1;
            pointer-events: none;
        }


        /* =========================
           HYPEHAUS LOGO
        ========================== */

        .logo-container {
            position: relative;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin-bottom: 20px;
        }

        .logo {
            width: min(140px, 35vw);
            max-width: 140px;
            height: auto;

            filter: drop-shadow(
                0 4px 24px rgba(0, 0, 0, 0.5)
            );
        }



        /* =========================
           TOP LEFT CLOCK
        ========================== */

        .clock {
            position: fixed;
            left: 20px;
            top: 20px;
            z-index: 20;
            font-size: 14px;
            font-weight: 500;
            font-variant-numeric: tabular-nums;
            color: white;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
        }

        .clock-colon {
            animation: blink 1s step-end infinite;
        }

        .clock-period {
            margin-left: 6px;
            color: rgba(255, 255, 255, 0.7);
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }


        /* =========================
           COMPACT ESPORTS MENU
        ========================== */

        .menu-container {
            position: fixed;
            left: 20px;
            top: 58px;
            z-index: 50;
        }

        .menu-toggle {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 5px;
            width: 44px;
            height: 44px;
            padding: 0;
            background: rgba(8, 8, 12, 0.72);
            border: 1px solid rgba(255, 255, 255, 0.28);
            border-left: 2px solid #ff3030;
            border-radius: 9px;
            cursor: pointer;
            box-shadow: 0 6px 22px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.12);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
        }

        .menu-toggle span {
            display: block;
            width: 21px;
            height: 2px;
            background: #fff;
            border-radius: 2px;
            box-shadow: 0 0 7px rgba(255,255,255,.3);
            transition: .25s ease;
        }

        .menu-toggle span:nth-child(2) {
            width: 15px;
            margin-left: -6px;
            background: #ff3030;
        }

        .menu-toggle:hover {
            transform: translateY(-1px);
            border-color: rgba(255,255,255,.5);
            box-shadow: 0 8px 26px rgba(0,0,0,.5), 0 0 16px rgba(255,48,48,.16);
        }

        .nav-menu {
            position: absolute;
            top: 51px;
            left: 0;
            width: 175px;
            padding: 5px;
            background: rgba(7, 7, 10, 0.93);
            backdrop-filter: blur(16px) saturate(140%);
            -webkit-backdrop-filter: blur(16px) saturate(140%);
            border: 1px solid rgba(255,255,255,.18);
            border-radius: 9px;
            overflow: hidden;
            box-shadow: 0 14px 35px rgba(0,0,0,.52);
            display: none;
            flex-direction: column;
        }

        .nav-menu.active {
            display: flex;
            animation: menuDrop .18s ease-out;
        }

        @keyframes menuDrop {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .nav-menu a {
            color: rgba(255,255,255,.92);
            text-decoration: none;
            padding: 11px 13px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 5px;
            border-bottom: 1px solid rgba(255,255,255,.07);
            transition: background .18s ease, padding-left .18s ease;
        }

        .nav-menu a:last-child { border-bottom: none; }

        .nav-menu a:hover {
            padding-left: 17px;
            background: rgba(255,48,48,.13);
            color: #fff;
        }

        /* =========================
           MUSIC PLAYER
        ========================== */

        .music-player {
            position: relative;
            margin: auto auto 20px auto;
            z-index: 10;

            display: flex;
            align-items: center;
            gap: 16px;

            width: min(420px, calc(100vw - 40px));
            padding: 8px 14px 8px 8px;

            border-radius: 999px;
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(24px) saturate(150%);
            -webkit-backdrop-filter: blur(24px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.20);
            box-shadow:
                0 8px 40px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);

            color: white;
        }


        /* =========================
           ALBUM COVER
        ========================== */

        .album-wrapper {
            position: relative;
            width: 58px;
            height: 58px;
            flex-shrink: 0;
        }

        .album-cover {
            width: 100%;
            height: 100%;
            overflow: hidden;
            border-radius: 50%;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.40);
            border: 1px solid rgba(255, 255, 255, 0.20);
        }

        .album-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .album-wrapper.playing .album-cover {
            animation: spin 8s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .album-center {
            pointer-events: none;
            position: absolute;
            top: 50%;
            left: 50%;
            width: 12px;
            height: 12px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.70);
            border: 2px solid rgba(255, 255, 255, 0.40);
        }


        /* =========================
           SONG INFORMATION
        ========================== */

        .song-info {
            min-width: 0;
            flex: 1;
        }

        .song-title {
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            font-size: 13px;
            font-weight: 600;
            color: white;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.30);
        }

        .song-artist {
            margin-top: 4px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.70);
        }


        /* =========================
           PROGRESS BAR
        ========================== */

        .progress-area {
            margin-top: 10px;
        }

        .progress-bar {
            position: relative;
            width: 100%;
            height: 8px;
            cursor: pointer;
        }

        .progress-background {
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 4px;
            transform: translateY(-50%);
            overflow: hidden;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.20);
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.90);
        }

        .progress-knob {
            position: absolute;
            top: 50%;
            left: 0%;
            width: 12px;
            height: 12px;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.40);
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .progress-bar:hover .progress-knob {
            opacity: 1;
        }

        .time {
            margin-top: 7px;
            text-align: left;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.60);
        }


        /* =========================
           MUSIC CONTROLS
        ========================== */

        .music-controls {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-shrink: 0;
        }

        .control-btn {
            display: grid;
            place-items: center;
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 50%;
            background: transparent;
            color: rgba(255, 255, 255, 0.80);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: white;
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        .play-btn {
            width: 44px;
            height: 44px;
            background: white;
            color: black;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.30);
        }

        .play-btn:hover {
            background: white;
            color: black;
            transform: scale(1.05);
        }

        .control-btn svg {
            width: 20px;
            height: 20px;
        }


        /* =========================
           SITE FOOTER STYLING
        ========================== */

        .site-footer {
            position: relative;
            width: 100%;
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px;
            background: rgba(10, 10, 15, 0.90);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 12px;
        }

        .footer-logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .footer-logo {
            width: 28px;
            height: auto;
        }

        .footer-brand {
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .footer-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .footer-links a {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s ease;
        }

        .footer-links a:hover {
            color: #ff3030;
        }

        /* Instagram Broadcast Button Style */
        .ig-broadcast-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: linear-pressed(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            background: linear-gradient(45deg, #f58529, #dd2a7b, #8134af, #515bd4);
            color: white !important;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(221, 42, 123, 0.3);
            transition: transform 0.2s ease, opacity 0.2s ease !important;
        }

        .ig-broadcast-btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        .ig-broadcast-btn svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .footer-copy {
            color: rgba(255, 255, 255, 0.6);
            font-size: 11px;
        }


        /* =========================
           MOBILE RESPONSIVE
        ========================== */

        @media (max-width: 768px) {

            .clock {
                display: none;
            }

            .menu-container {
                left: 15px;
                top: 20px;
            }

            .menu-toggle {
                width: 42px;
                height: 42px;
            }

            .nav-menu {
                width: 165px;
                top: 49px;
            }

            .logo-container {
                top: 12px;
                margin-bottom: 10px;
            }

            .logo {
                width: min(115px, 35vw);
                max-width: 115px;
            }

            .music-player {
                width: min(360px, calc(100vw - 30px));
                gap: 8px;
                padding: 8px 12px 8px 8px;
                margin-bottom: 15px;
            }

            .album-wrapper {
                width: 50px;
                height: 50px;
            }

            .music-controls {
                gap: 0;
            }

            .control-btn {
                width: 32px;
                height: 32px;
            }

            .play-btn {
                width: 40px;
                height: 40px;
            }

            .song-title {
                font-size: 13px;
            }

            .song-artist {
                font-size: 11px;
            }

            .site-footer {
                flex-direction: column;
                gap: 10px;
                padding: 12px 15px;
                text-align: center;
            }

            .footer-links {
                flex-wrap: wrap;
                justify-content: center;
                gap: 12px;
            }

        }



        /* =========================
           LIVE VIEWERS
        ========================== */

        .live-viewers {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 20;

            display: flex;
            align-items: center;
            gap: 8px;

            padding: 10px 14px;

            color: white;
            font-size: 13px;
            font-weight: 600;

            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 999px;

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
        }

        .live-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #38d39f;
            box-shadow: 0 0 0 0 rgba(56, 211, 159, 0.7);
            animation: livePulse 1.5s infinite;
        }

        @keyframes livePulse {
            0% {
                box-shadow: 0 0 0 0 rgba(56, 211, 159, 0.7);
            }
            70% {
                box-shadow: 0 0 0 8px rgba(56, 211, 159, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(56, 211, 159, 0);
            }
        }

        @media (max-width: 768px) {
            .live-viewers {
                top: 15px;
                right: 15px;
                padding: 8px 11px;
                font-size: 11px;
            }
        }

    </style>
</head>

    <script>

        const audio = document.getElementById("audioPlayer");

        const playButton =
            document.getElementById("playButton");

        const playIcon =
            document.getElementById("playIcon");

        const progressBar =
            document.getElementById("progressBar");

        const progressFill =
            document.getElementById("progressFill");

        const progressKnob =
            document.getElementById("progressKnob");

        const timeDisplay =
            document.getElementById("timeDisplay");

        const albumWrapper =
            document.getElementById("albumWrapper");

        const songTitle = document.getElementById("songTitle");
        const songArtist = document.getElementById("songArtist");
        const albumCoverImg = document.getElementById("albumCoverImg");
        const prevButton = document.getElementById("prevButton");
        const nextButton = document.getElementById("nextButton");

        // Playlist configuration with two songs
        const playlist = [
            {
                title: "The Winner Takes It All",
                artist: "Song by Swedish pop group ABBA",
                src: "song.mp3",
                cover: "covers/N0jnLZxYwYc.jpg"
            },
            {
                title: "TERI TERI YAAD", // Change to your second song's title
                artist: "Song by GYAANI SANGEET", // Change to your second song's artist
                src: "song2.mp3",
                cover: "covers/images1.jpg" // Change cover image path if needed
            }
        ];

        let currentTrackIndex = 0;

        function loadTrack(index) {
            const track = playlist[index];
            audio.src = track.src;
            songTitle.textContent = track.title;
            songArtist.textContent = track.artist;
            albumCoverImg.src = track.cover;
            audio.load();
        }

        // Initialize first track
        loadTrack(currentTrackIndex);


        /* LIVE CLOCK */

        const clock = document.getElementById("clock");

        function updateClock() {
            const now = new Date();

            const hours24 = now.getHours();
            const hours12 = hours24 % 12 || 12;
            const minutes = now.getMinutes().toString().padStart(2, "0");
            const period = hours24 >= 12 ? "pm" : "am";

            clock.innerHTML =
                `${hours12}<span class="clock-colon">:</span>${minutes}` +
                `<span class="clock-period">${period}</span>`;
        }

        updateClock();
        setInterval(updateClock, 1000);


        /* 3-LINE MENU TOGGLE */

        const menuToggle = document.getElementById("menuToggle");
        const navMenu = document.getElementById("navMenu");

        menuToggle.addEventListener("click", function (event) {
            event.stopPropagation();
            navMenu.classList.toggle("active");
        });

        // Close menu when clicking outside
        document.addEventListener("click", function () {
            navMenu.classList.remove("active");
        });


        /* PLAY / PAUSE */

        playButton.addEventListener("click", function () {

            if (audio.paused) {

                audio.play();

            } else {

                audio.pause();

            }

        });


        /* NEXT & PREVIOUS CONTROLS */

        nextButton.addEventListener("click", function () {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex);
            audio.play();
        });

        prevButton.addEventListener("click", function () {
            currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentTrackIndex);
            audio.play();
        });


        /* WHEN SONG STARTS */

        audio.addEventListener("play", function () {

            albumWrapper.classList.add("playing");

            playIcon.innerHTML = `
                <path d="M6 5h4v14H6zm8 0h4v14h-4z"></path>
            `;

            playButton.setAttribute(
                "aria-label",
                "Pause"
            );

        });


        /* WHEN SONG PAUSES */

        audio.addEventListener("pause", function () {

            albumWrapper.classList.remove("playing");

            playIcon.innerHTML = `
                <path d="M8 5v14l11-7z"></path>
            `;

            playButton.setAttribute(
                "aria-label",
                "Play"
            );

        });


        /* UPDATE PROGRESS */

        audio.addEventListener("timeupdate", function () {

            if (!audio.duration) return;

            const progress =
                (audio.currentTime / audio.duration) * 100;

            progressFill.style.width =
                progress + "%";

            progressKnob.style.left =
                progress + "%";

            const currentMinutes =
                Math.floor(audio.currentTime / 60);

            const currentSeconds =
                Math.floor(audio.currentTime % 60)
                    .toString()
                    .padStart(2, "0");

            const totalMinutes =
                Math.floor(audio.duration / 60);

            const totalSeconds =
                Math.floor(audio.duration % 60)
                    .toString()
                    .padStart(2, "0");

            timeDisplay.textContent =
                `${currentMinutes}:${currentSeconds} / ${totalMinutes}:${totalSeconds}`;

        });


        /* CLICK TO SEEK */

        progressBar.addEventListener(
            "click",
            function (event) {

                if (!audio.duration) return;

                const rect =
                    progressBar.getBoundingClientRect();

                const clickPosition =
                    event.clientX - rect.left;

                const percentage =
                    clickPosition / rect.width;

                audio.currentTime =
                    percentage * audio.duration;

            }
        );


        /* WHEN SONG ENDS (Auto-advance to next track) */

        audio.addEventListener("ended", function () {

            progressFill.style.width = "0%";
            progressKnob.style.left = "0%";

            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex);
            audio.play();

        });



        /* =========================
           LIVE VIEWER DISPLAY
        ========================== */

        const viewerCount =
            document.getElementById("viewerCount");

        /*
         * The number always stays between
         * 30 and 100.
         *
         * It changes automatically every
         * 10 seconds.
         */

        let displayedViewers =
            Math.floor(Math.random() * 71) + 30;

        viewerCount.textContent =
            displayedViewers;


        changeCount = function updateViewerCount() {

            /*
             * Create a new random number
             * between 30 and 100.
             */

            const newViewers =
                Math.floor(Math.random() * 71) + 30;

            displayedViewers =
                newViewers;

            viewerCount.textContent =
                displayedViewers;
        }


        /*
         * Change the number every 10 seconds.
         */

        setInterval(
            updateViewerCount,
            10000
        );
    </script>

</body>
</html>
